name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository and contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit, component and consumer contract tests with coverage gates
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Summarise test results
        if: always()
        run: node scripts/test-summary.mjs vitest

      - name: Upload Vitest and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-and-coverage
          path: |
            reports/vitest/
            coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository and contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser tests against isolated test services
        run: npm run test:e2e

      - name: Summarise browser results
        if: always()
        run: node scripts/test-summary.mjs e2e

      - name: Upload browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            reports/playwright/
            playwright-report/
            test-results/
          retention-days: 14

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository and contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mutation test question validation with score gate
        run: npm run test:mutation

      - name: Summarise mutation results
        if: always()
        run: node scripts/test-summary.mjs mutation

      - name: Upload mutation analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results
          path: reports/mutation/
          retention-days: 14
