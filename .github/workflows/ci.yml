name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 1. Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo and shared contract
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit, component and consumer contract tests with 80% minimum coverage
        run: npm run test:coverage

      - name: Summarise test results
        if: always()
        run: node scripts/test-summary.mjs vitest

      - name: Upload Vitest and coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-and-coverage
          path: |
            reports/vitest/
            coverage/
          retention-days: 14

  checks:
    name: 2. Type check
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo and shared contract
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  build:
    name: 3. Production build
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo and shared contract
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: currency-quiz-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: 4. Browser tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo and shared contract
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser tests against isolated test services
        run: npm run test:e2e

      - name: Summarise browser results
        if: always()
        run: node scripts/test-summary.mjs e2e

      - name: Upload browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: |
            reports/playwright/
            playwright-report/
            test-results/
          retention-days: 14

  mutation:
    name: 5. Mutation tests
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo and shared contract
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mutation test question validation with score gate
        run: npm run test:mutation

      - name: Summarise mutation results
        if: always()
        run: node scripts/test-summary.mjs mutation

      - name: Upload mutation analysis
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-results
          path: reports/mutation/
          retention-days: 14
