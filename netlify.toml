[build]
command = "npm run build"
publish = "dist"

[[headers]]
for = "/*"
[headers.values]
Strict-Transport-Security = '''
    max-age=63072000;
    includeSubDomains;
    preload'''

# Same-origin API proxy keeps admin cookies first-party in the browser.
[[redirects]]
from = "/api/*"
to = "https://currencyquiz-backend.onrender.com/api/:splat"
status = 200
force = true

# Pages
[[redirects]]
from = "/"
to = "/index.html"
status = 200

[[redirects]]
from = "/documentation"
to = "/index.html"
status = 200

[[redirects]]
from = "/documentation/:section"
to = "/index.html"
status = 200

[[redirects]]
from = "/admin"
to = "/index.html"
status = 200

[[redirects]]
from = "/admin/login"
to = "/index.html"
status = 200

# 404
[[redirects]]
from = "/*"
to = "/index.html"
status = 404
