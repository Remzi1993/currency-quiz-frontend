[[headers]]
for = "/*"
[headers.values]
Strict-Transport-Security = '''
    max-age=63072000;
    includeSubDomains;
    preload'''

# Pages
[[redirects]]
from = "/"
to = "/index.html"
status = 200

[[redirects]]
from = "/documentation"
to = "/index.html"
status = 200

[[redirects]]
from = "/documentation/:section"
to = "/index.html"
status = 200

# 404
[[redirects]]
from = "/*"
to = "/index.html"
status = 404